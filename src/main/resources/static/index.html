<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Matrix Calculator | Матричный калькулятор</title>
    <link rel="stylesheet" href="main.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<!-- ============================================
     ШАПКА САЙТА
     ============================================ -->
<header id="header">
    <div class="header-content">
        <div class="logo-wrapper" onclick="resetApp()">
            <i class="fas fa-calculator" id="header-logo-icon"></i>
        </div>
        <h1 class="header-title">
            <a href="#" onclick="resetApp(); return false;">Матричный калькулятор</a>
        </h1>
        <div class="header-placeholder"></div>
    </div>
</header>

<!-- ============================================
     ОСНОВНОЙ БЛОК С МАТРИЦАМИ
     ============================================ -->
<main id="main-container">
    <div id="matrix-solution-block">

        <!-- МАТРИЦА A -->
        <div class="matrix-wrapper" id="wrapper1">
            <div class="matrix-header">
                <h3 class="matrix-title matrix-a-title">
                    <i class="fas fa-matrix"></i> Матрица A
                </h3>
                <div class="dimension-controls">
                    <input type="number" id="rows1" class="dimension-input" min="1" max="10" value="4" onchange="renderMatrix(1)">
                    <span class="cross-icon">×</span>
                    <input type="number" id="cols1" class="dimension-input" min="1" max="10" value="4" onchange="renderMatrix(1)">
                </div>
            </div>
            <div id="matrix1" class="matrix-container matrix-one"></div>
        </div>

        <!-- КНОПКИ ОБМЕНА И ОЧИСТКИ (ПО ЦЕНТРУ) -->
        <div class="center-controls">
            <button id="matrix-exchange" onclick="swapMatrices()" title="Поменять матрицы местами">
                <i class="fas fa-exchange-alt"></i>
            </button>
            <button id="clear-matrices" onclick="clearMatrices()" title="Очистить матрицы">
                <i class="fas fa-eraser"></i>
            </button>
        </div>

        <!-- МАТРИЦА B -->
        <div class="matrix-wrapper" id="wrapper2">
            <div class="matrix-header">
                <h3 class="matrix-title matrix-b-title">
                    <i class="fas fa-matrix"></i> Матрица B
                </h3>
                <div class="dimension-controls">
                    <input type="number" id="rows2" class="dimension-input" min="1" max="10" value="4" onchange="renderMatrix(2)">
                    <span class="cross-icon">×</span>
                    <input type="number" id="cols2" class="dimension-input" min="1" max="10" value="4" onchange="renderMatrix(2)">
                </div>
            </div>
            <div id="matrix2" class="matrix-container matrix-two"></div>
        </div>

        <!-- =========================
             ПАНЕЛЬ ВЫБОРА ОПЕРАЦИЙ
             ========================= -->
        <div class="action-selection-window">
            <div class="operation-icon">
                <i class="fas fa-function"></i>
            </div>

            <!-- ВЫПАДАЮЩИЙ СПИСОК ОПЕРАЦИЙ -->
            <select id="choosing-operation" class="styled-select main-op" onchange="onOperationChange()">
                <option value="" selected disabled>-- Выберите операцию --</option>
            </select>

            <!-- КНОПКА ВЫЧИСЛИТЬ -->
            <button class="calculate-btn" onclick="generateAPI()">
                <i class="fas fa-play"></i> Вычислить
            </button>

            <!-- ЧЕКБОКСЫ АКТИВАЦИИ МАТРИЦ (ВЫРОВНЕНЫ ПО ЦЕНТРУ) -->
            <div class="checkbox-list">
                <label class="checkbox-container">
                    <input class="custom-checkbox" id="checkA" checked type="checkbox" onchange="updateUI()">
                    <span class="checkmark"></span>
                    <span class="checkbox-label"><i class="fas fa-matrix"></i> Матрица A активна</span>
                </label>
                <label class="checkbox-container">
                    <input class="custom-checkbox" id="checkB" checked type="checkbox" onchange="updateUI()">
                    <span class="checkmark"></span>
                    <span class="checkbox-label"><i class="fas fa-matrix"></i> Матрица B активна</span>
                </label>
            </div>
        </div>
    </div>
</main>

<!-- ============================================
     БЛОК РЕЗУЛЬТАТА ВЫЧИСЛЕНИЙ
     ============================================ -->
<section id="result-container" style="max-width: 1200px; margin: 20px auto; padding: 0 20px;">
    <div class="result-card" id="result-card" style="display: none;">
        <div class="result-header">
            <h3><i class="fas fa-chalkboard-user"></i> Результат вычислений</h3>
            <button onclick="closeResult()" class="close-result">&times;</button>
        </div>
        <div id="result-content" class="result-content"></div>
    </div>
</section>

<!-- ========================
     БЛОК ИСТОРИИ ВЫЧИСЛЕНИЙ
     ========================-->
<section id="history-container" style="max-width: 1200px; margin: 20px auto; padding: 0 20px;">
    <div class="history-card">
        <div class="history-header">
            <h2><i class="fas fa-history"></i> История вычислений</h2>
            <div class="history-actions">
                <button onclick="clearHistory()" class="history-btn danger" title="Очистить историю">
                    <i class="fas fa-trash-alt"></i>
                </button>
            </div>
        </div>
        <div id="history-list" class="history-list">
            <div class="empty-history">
                <i class="fas fa-inbox"></i>
                <p>История пуста. Выполните вычисления, чтобы они появились здесь.</p>
            </div>
        </div>
    </div>
</section>

<!-- ========================
     ПОДВАЛ С ССЫЛКОЙ "О НАС"
     =========================-->
<footer id="footer">
    <p><i class="fas fa-info-circle"></i> <a href="#" onclick="showAboutPage(); return false;">О нас</a> | 2026 Матричный калькулятор</p>
</footer>

<!-- ============================================
     КОНТЕЙНЕР ДЛЯ СТРАНИЦЫ "О НАС" (ДИНАМИЧЕСКИ)
     ============================================ -->
<div id="about-page-container"></div>

<script src="main.js"></script>
</body>
</html>
